# Production Configuration Profile (application-prod.properties)
# Enabled via environment variable: SPRING_PROFILES_ACTIVE=prod or -Dspring.profiles.active=prod

# PostgreSQL Connection from Environment Variables
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/devflow}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:0246}
spring.datasource.driver-class-name=org.postgresql.Driver

# Non-destructive Hibernate Strategy for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Server Configuration
server.port=${PORT:8080}

# JWT Authentication Configuration from Environment Variables
devflow.app.jwtSecret=${JWT_SECRET:devflowSuperSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm}
devflow.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Dynamic Production CORS Allowed Origins (Comma-separated)
devflow.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
